stages:
  - build
  - run

variables:
  DOCKER_DRIVER: overlay2

services:
  - docker:dind

before_script:
  - docker info

build_image:
  stage: build
  image: docker:latest
  script:
    - docker build -t d387-app .

run_container:
  stage: run
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t d387-app .
    - docker run -d -p 8080:8080 --name d387-container d387-app
    - sleep 15
    - docker ps
    - docker logs d387-container
